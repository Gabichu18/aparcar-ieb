# Keeps the free Render server awake on weekday daytime so the daily
# "¿Quedan sitios libres?" notifications go out on time. Free (GitHub Actions minutes).
name: Despertar la app
on:
  schedule:
    # Every 15 min, Mon-Fri, covering 08:00-11:20 Madrid time in both winter (UTC+1) and summer (UTC+2).
    # GitHub uses UTC: 06:00-10:15 UTC.
    - cron: '*/15 6-9 * * 1-5'
    - cron: '0,15 10 * * 1-5'
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 --retry 2 https://aparcar-ieb.onrender.com/healthz || true
